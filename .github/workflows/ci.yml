name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 私有仓库分钟额度有限：同一分支的新 push 取消未跑完的旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    # windows-latest 匹配本地验收平台（终端/shell/路径行为都是 Windows 语义）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,documents]"
      - run: python -m pytest -q
        env:
          # rich 按 80 列换行会拆散 CLI help 断言的字符串；本地终端更宽
          COLUMNS: "200"

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:ui
      - run: npm run test:run
      # Playwright e2e 与视觉基线是 win32 截图，跨平台必挂，留给本地验收矩阵
