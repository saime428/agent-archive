[project]
name = "agent"
version = "2.1.0"
description = "A minimal Python CLI agent core."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20,<5",
    # Protocol-log filtering is verified against this exact SDK source layout.
    "mcp==1.28.1",
    "referencing>=0.28.4,<1",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
documents = [
    "defusedxml>=0.7.1,<1",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Typer 0.26 removed isolated_filesystem from its bundled test runner.
    "typer<0.26",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent"]

[tool.coverage.report]
show_missing = true
skip_empty = true
